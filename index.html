  clearCellColHighlights();
  $("#sel-status").textContent = "No cell/col selection";
  renderBoxes();
}

function ensureLoader() {
  let el = $("#scroll-loader");
  if (!el) {
    el = document.createElement("div");
    el.id = "scroll-loader";
    el.className = "scroll-loader";
    el.textContent = "Loading more pages…";
    $("#docpane").appendChild(el);
  }
  return el;
}

async function remountWindow(focusPage) {
  const pane = $("#docpane");
  state.scroll.suppressObserver = true;
  if (state.scroll.observer) state.scroll.observer.disconnect();
  pane.replaceChildren();
  state.scroll.mountedPages = new Set();

  const max = state.pageCount - 1;
  const lo = Math.max(0, focusPage - SCROLL_BUFFER);
  const hi = Math.min(max, focusPage + SCROLL_BUFFER);
  for (let p = lo; p <= hi; p++) {
    const sec = await renderPageSection(p, p === focusPage);
    pane.appendChild(sec);
    wirePageClicks(sec);
    state.scroll.mountedPages.add(p);
  }
  ensureLoader();
  setupObserver();
  highlightSelection();
  scrollToFocusSection("instant");
  requestAnimationFrame(() => {
    state.scroll.suppressObserver = false;
  });
}

function scrollToFocusSection(behavior) {
  const sec = $(`.page-section[data-page="${state.page}"]`);
  if (sec) sec.scrollIntoView({ behavior: behavior || "instant", block: "start" });
}

async function expandEdges() {
  if (state.scroll.expanding || !state.pageCount) return;
  const mounted = [...state.scroll.mountedPages].sort((a, b) => a - b);
  if (!mounted.length) return;
  const pane = $("#docpane");
  const sections = [...pane.querySelectorAll(".page-section")];
  let best = null;
  let bestRatio = 0;
  for (const sec of sections) {
    const r = sec.getBoundingClientRect();
    const pr = pane.getBoundingClientRect();
    const visible = Math.max(0, Math.min(r.bottom, pr.bottom) - Math.max(r.top, pr.top));
    const ratio = visible / Math.max(1, r.height);
    if (ratio > bestRatio) {
      bestRatio = ratio;
      best = parseInt(sec.dataset.page, 10);
    }
  }
  if (best == null) return;

  const minM = mounted[0];
  const maxM = mounted[mounted.length - 1];
  const maxPage = state.pageCount - 1;
  const needPrev = best - minM <= SCROLL_EDGE && minM > 0;
  const needNext = maxM - best <= SCROLL_EDGE && maxM < maxPage;
  if (!needPrev && !needNext) return;

  state.scroll.expanding = true;
  ensureLoader().classList.add("on");
  try {
    if (needPrev) {
      const scrollTopBefore = pane.scrollTop;
      const heightBefore = pane.scrollHeight;
      const from = Math.max(0, minM - SCROLL_EXPAND);
      for (let p = minM - 1; p >= from; p--) {
        if (state.scroll.mountedPages.has(p)) continue;
        const sec = await renderPageSection(p, false);
        pane.insertBefore(sec, pane.firstChild);
        wirePageClicks(sec);
        state.scroll.mountedPages.add(p);
        if (state.scroll.observer) state.scroll.observer.observe(sec);
      }
      pane.scrollTop = scrollTopBefore + (pane.scrollHeight - heightBefore);
    }
    if (needNext) {
      const to = Math.min(maxPage, maxM + SCROLL_EXPAND);
      const loader = ensureLoader();
      for (let p = maxM + 1; p <= to; p++) {
        if (state.scroll.mountedPages.has(p)) continue;
        const sec = await renderPageSection(p, false);
        pane.insertBefore(sec, loader);
        wirePageClicks(sec);
        state.scroll.mountedPages.add(p);
        if (state.scroll.observer) state.scroll.observer.observe(sec);
      }
    }
    trimMounted(best);
  } finally {
    ensureLoader().classList.remove("on");
    state.scroll.expanding = false;
  }
}

function trimMounted(anchor) {
  const mounted = [...state.scroll.mountedPages].sort((a, b) => a - b);
  if (mounted.length <= SCROLL_MAX_SPAN) return;
  const pane = $("#docpane");
  for (const p of mounted) {
    if (Math.abs(p - anchor) <= Math.floor(SCROLL_MAX_SPAN / 2)) continue;
    if (p === state.page) continue;
    const sec = pane.querySelector(`.page-section[data-page="${p}"]`);
    if (!sec) continue;
    if (state.scroll.observer) state.scroll.observer.unobserve(sec);
    sec.remove();
    state.scroll.mountedPages.delete(p);
  }
}

function setupObserver() {
  if (state.scroll.observer) state.scroll.observer.disconnect();
  state.scroll.observer = new IntersectionObserver((entries) => {
    if (state.scroll.suppressObserver) return;
    let best = null;
    let bestRatio = 0;
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      if (e.intersectionRatio >= bestRatio) {
        bestRatio = e.intersectionRatio;
        best = parseInt(e.target.dataset.page, 10);
      }
    }
    if (best == null || Number.isNaN(best)) return;

    document.querySelectorAll(".page-section.focus").forEach((el) => el.classList.remove("focus"));
    const sec = $(`.page-section[data-page="${best}"]`);
    if (sec) sec.classList.add("focus");

    if (state.scroll.autoPdfSync && best !== state.scroll.pdfFocusPage) {
      renderPdfPage(best);
    }
    // Only retarget "focus page" from scroll when auto-sync is on OR the
    // section is clearly dominant — avoids tiny pages flipping focus.
    if (best !== state.page && (state.scroll.autoPdfSync || bestRatio >= 0.45)) {
      state.page = best;
      $("#pageno").value = String(best + 1);
      syncRoute(false);
    }
  }, {
    root: $("#docpane"),
    threshold: [0.1, 0.25, 0.5, 0.75],
  });
  for (const sec of $("#docpane").querySelectorAll(".page-section")) {
    state.scroll.observer.observe(sec);
  }
}

$("#docpane").addEventListener("scroll", () => {
  if (state.scroll.expanding || state.scroll.suppressObserver) return;
  clearTimeout($("#docpane")._edgeT);
  $("#docpane")._edgeT = setTimeout(() => expandEdges(), 80);
});

function highlightSelection() {
  document.querySelectorAll("table.sel-table").forEach((el) => el.classList.remove("sel-table"));
  if (!state.selectedBlockId) return;
  const el = document.querySelector(
    `table[data-block-id="${CSS.escape(state.selectedBlockId)}"]`
  );
  if (el) el.classList.add("sel-table");
}

function currentPageTables() {
  const data = pageData(state.scroll.pdfFocusPage ?? state.page);
  return data?.tables || [];
}

function currentPageSize() {
  const data = pageData(state.scroll.pdfFocusPage ?? state.page);
  const fromJson = data?.page_size || data?.meta?.page_size;
  if (fromJson && fromJson.length >= 2) return [Number(fromJson[0]), Number(fromJson[1])];
  return state.pdfPageSize || [720, 864];
}

function addPdfBox(boxes, viewport, topLeftRect, className, title) {
  if (!topLeftRect || topLeftRect.length < 4 || !viewport) return;
  const mapped = mapOcrRectToOverlay(topLeftRect, viewport, currentPageSize());
  if (!mapped) return;
  const div = document.createElement("div");
  div.className = className;
  div.style.left = `${mapped.left}px`;
  div.style.top = `${mapped.top}px`;
  div.style.width = `${mapped.width}px`;
  div.style.height = `${mapped.height}px`;
  if (title) div.title = title;
  boxes.appendChild(div);
}

/**
 * Map pdf_ocr / PyMuPDF top-left rect (cropbox page space) onto the PDF.js canvas.
 *
 * PyMuPDF page.rect / text bboxes are relative to the cropbox top-left.
 * PDF.js convertToViewportPoint wants absolute PDF user space (mediabox),
 * where V2B OCR cropbox often starts at (33,33) — that was the manual ox=33 oy=-33.
 */
function mapOcrRectToOverlay(rect, viewport, pageSize) {
  const c = state.bboxCalib;
  let [x0, y0, x1, y1] = rect.map(Number);
  const s = c.scale || 1;
  const ox = c.ox || 0;
  const oy = c.oy || 0;
  x0 = x0 * s + ox;
  y0 = y0 * s + oy;
  x1 = x1 * s + ox;
  y1 = y1 * s + oy;

  const view = state.pdfView;
  let corners;
  if (view && view.length >= 4 && c.flipY) {
    // crop origin: PDF (view[0], view[3]) == PyMuPDF (0, 0)
    const vx0 = view[0];
    const vyTop = view[3];
    corners = [
      [vx0 + x0, vyTop - y0],
      [vx0 + x1, vyTop - y0],
      [vx0 + x0, vyTop - y1],
      [vx0 + x1, vyTop - y1],
    ];
  } else {
    const [, ph] = pageSize || [720, 864];
    if (!ph) return null;
    corners = c.flipY
      ? [
          [x0, ph - y0],
          [x1, ph - y0],
          [x0, ph - y1],
          [x1, ph - y1],
        ]
      : [
          [x0, y0],
          [x1, y0],
          [x0, y1],
          [x1, y1],
        ];
  }

  const pts = corners.map(([x, y]) => viewport.convertToViewportPoint(x, y));
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const left = Math.min(...xs) + (c.vx || 0);
  const top = Math.min(...ys) + (c.vy || 0);
  return {
    left,
    top,
    width: Math.max(...xs) - Math.min(...xs),
    height: Math.max(...ys) - Math.min(...ys),
  };
}

function syncCalibUi() {
  const c = state.bboxCalib;
  $("#cal-flip-y").checked = Boolean(c.flipY);
  $("#cal-scale").value = String(c.scale);
  $("#cal-scale-range").value = String(c.scale);
  $("#cal-ox").value = String(c.ox);
  $("#cal-ox-range").value = String(c.ox);
  $("#cal-oy").value = String(c.oy);
  $("#cal-oy-range").value = String(c.oy);
  $("#cal-vx").value = String(c.vx || 0);
  $("#cal-vx-range").value = String(c.vx || 0);
  $("#cal-vy").value = String(c.vy || 0);
  $("#cal-vy-range").value = String(c.vy || 0);
  const sz = currentPageSize();
  const view = state.pdfView;
  const cropNote = view
    ? ` · crop@(${Number(view[0]).toFixed(0)},${Number(view[1]).toFixed(0)})`
    : "";
  $("#cal-readout").textContent =
    `${sz.map((n) => n.toFixed(0)).join("×")}pt${cropNote}` +
    ` · s=${Number(c.scale).toFixed(3)} ox=${c.ox} oy=${c.oy}` +
    ` · vx=${c.vx || 0} vy=${c.vy || 0}` +
    ` · flipY=${c.flipY ? "on" : "off"}`;
}

function readCalibFromUi() {
  state.bboxCalib = {
    flipY: $("#cal-flip-y").checked,
    scale: Math.min(1.5, Math.max(0.5, parseFloat($("#cal-scale").value) || 1)),
    ox: parseFloat($("#cal-ox").value) || 0,
    oy: parseFloat($("#cal-oy").value) || 0,
    vx: parseFloat($("#cal-vx").value) || 0,
    vy: parseFloat($("#cal-vy").value) || 0,
  };
  try {
    localStorage.setItem("pdf-ocr-live-bbox-calib-v4", JSON.stringify(state.bboxCalib));
  } catch (_) { /* ignore */ }
  syncCalibUi();
  renderBoxes();
}

function loadCalib() {
  try {
    // v3 often stored ox=33 oy=-33 (cropbox); crop is automatic now
    localStorage.removeItem("pdf-ocr-live-bbox-calib");
    localStorage.removeItem("pdf-ocr-live-bbox-calib-v2");
    localStorage.removeItem("pdf-ocr-live-bbox-calib-v3");
    const raw = localStorage.getItem("pdf-ocr-live-bbox-calib-v4");
    if (raw) {
      state.bboxCalib = {
        flipY: true, scale: 1, ox: 0, oy: 0, vx: 0, vy: 0,
        ...JSON.parse(raw),
      };
    }
  } catch (_) { /* ignore */ }
  syncCalibUi();
}

function renderBoxes() {
  const boxes = $("#boxes");
  boxes.replaceChildren();
  const viewport = state.pdfViewport;
  if (!viewport) return;
  const focusPage = state.scroll.pdfFocusPage ?? state.page;
  const tables = currentPageTables();

  if (state.show.cols) {
    for (const t of tables) {
      for (const c of t.columns || []) {
        addPdfBox(boxes, viewport, c.pdf_rect, "bbox-hl col-all", c.name);
      }
    }
  }
  if (state.show.cells) {
    for (const t of tables) {
      for (const c of t.cells || []) {
        addPdfBox(boxes, viewport, c.pdf_rect, "bbox-hl cell-all", c.label);
      }
    }
  }

  let i = 0;
  for (const t of tables) {
    const r = t.pdf_rect;
    if (!r || r.length < 4) continue;
    i += 1;
    const mapped = mapOcrRectToOverlay(r, viewport, currentPageSize());
    if (!mapped) continue;
    const div = document.createElement("div");
    div.className = "tbox" + (t.block_id === state.selectedBlockId ? " sel" : "");
    div.style.left = `${mapped.left}px`;
    div.style.top = `${mapped.top}px`;
    div.style.width = `${mapped.width}px`;
    div.style.height = `${mapped.height}px`;
    const badge = document.createElement("span");
    badge.className = "n";
    badge.textContent = t.kind ? String(t.kind) : String(i);
    div.appendChild(badge);
    div.title = t.kind
      ? `${t.kind}${t.kind_name ? ` · ${t.kind_name}` : ""}\n${t.block_id || ""}`
      : (t.block_id || "");
    if (state.kindFilter && t.kind && t.kind !== state.kindFilter) {
      div.style.opacity = "0.25";
    }
    div.addEventListener("click", (ev) => {
      ev.stopPropagation();
      state.selectedBlockId = t.block_id || null;
      state.selection = null;
      clearCellColHighlights();
      $("#sel-status").textContent = "No cell/col selection";
      highlightSelection();
      const target = document.querySelector(
        `table[data-block-id="${CSS.escape(state.selectedBlockId)}"]`
      );
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
      renderBoxes();
    });
    boxes.appendChild(div);
  }

  const sel = state.selection;
  if (sel && sel.page0 === focusPage && sel.pdf_rect) {
    addPdfBox(
      boxes,
      viewport,
      sel.pdf_rect,
      sel.kind === "col" ? "bbox-hl col" : "bbox-hl",
      sel.label
    );
  }
}

function updatePageMinHeight(canvasHeight) {
  const h = Math.max(420, Math.round(canvasHeight || 0));
  document.documentElement.style.setProperty("--page-min-h", `${h}px`);
}

function computeScale(pageWidthPt, pageHeightPt) {
  const pane = $("#pdfpane");
  const availW = Math.max(120, pane.clientWidth - 24);
  const availH = Math.max(120, pane.clientHeight - 24);
  if (state.zoom.mode === "fitw") return availW / pageWidthPt;
  if (state.zoom.mode === "fith") return availH / Math.max(1, pageHeightPt);
  return (state.zoom.pct / 100) * (availW / pageWidthPt);
}

function syncZoomUi() {
  $("#z-fitw")?.classList.toggle("active", state.zoom.mode === "fitw");
  $("#z-fith")?.classList.toggle("active", state.zoom.mode === "fith");
  if (state.zoom.mode === "custom") {
    $("#z-pct").value = String(state.zoom.pct);
  }
}

function isCancelError(err) {
  if (!err) return false;
  const name = err.name || "";
  const msg = String(err.message || err);
  return name === "RenderingCancelledException"
    || name === "AbortException"
    || /cancel/i.test(msg);
}

async function cancelActiveRender() {
  const task = state.scroll.renderTask;
  if (!task) return;
  state.scroll.renderTask = null;
  try { task.cancel(); } catch (_) { /* ignore */ }
  try { await task.promise; } catch (err) {
    if (!isCancelError(err)) console.warn(err);
  }
}

async function renderPdfPage(page0) {
  if (!state.pdfDoc) return;
  const token = ++state.scroll.renderToken;
  state.scroll.pdfFocusPage = page0;
  await cancelActiveRender();
  if (token !== state.scroll.renderToken) return;

  try {
    const page = await state.pdfDoc.getPage(page0 + 1);
    if (token !== state.scroll.renderToken) return;

    // Unrotated media size (PDF points). OCR JSON page_size should match this.
    const baseUnrot = page.getViewport({ scale: 1, rotation: 0 });
    state.pdfPageSize = [baseUnrot.width, baseUnrot.height];
    // Crop/view box in PDF user space — PyMuPDF coords are relative to its top-left.
    state.pdfView = Array.isArray(page.view) ? page.view.slice(0, 4).map(Number) : null;
    syncCalibUi();

    const rotation = ((page.rotate || 0) + (state.rotateExtra || 0)) % 360;
    const base = page.getViewport({ scale: 1, rotation });
    const scale = computeScale(base.width, base.height);
    const viewport = page.getViewport({ scale, rotation });
    // Reflect effective zoom % vs fit-width baseline (UI feedback)
    const availW = Math.max(120, $("#pdfpane").clientWidth - 24);
    const fitW = availW / Math.max(1, base.width);
    $("#z-pct").value = String(Math.max(1, Math.round((scale / fitW) * 100)));
    syncZoomUi();

    const canvas = $("#pdfcanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    // Keep CSS size == attribute size so overlay px match viewport coords
    canvas.style.width = `${canvas.width}px`;
    canvas.style.height = `${canvas.height}px`;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const renderTask = page.render({ canvasContext: ctx, viewport, intent: "display" });
    state.scroll.renderTask = renderTask;
    await renderTask.promise;
    if (token !== state.scroll.renderToken) return;
    if (state.scroll.renderTask === renderTask) state.scroll.renderTask = null;
    state.pdfViewport = viewport;
    updatePageMinHeight(canvas.height);
    await ensurePage(page0);
    renderBoxes();
    const rotNote = rotation ? ` · rot ${rotation}°` : "";
    const data = pageData(page0);
    const has = data && !data.missing ? "" : " · no json";
    setStatus(`PDF p.${page0 + 1} / ${state.pageCount}${has}${rotNote} · run ${state.run}`);
  } catch (err) {
    if (isCancelError(err)) return;
    console.error(err);
    toast(`PDF render failed: ${err.message || err}`);
  }
}

function syncRoute(push) {
  const url = new URL(location.href);
  if (state.mode === "pack" && state.packName) {
    url.searchParams.set("pack", state.packName);
    url.searchParams.delete("run");
  } else {
    url.searchParams.set("run", state.run);
    url.searchParams.delete("pack");
  }
  url.searchParams.set("page", String(state.page + 1));
  // Preserve / apply hash for QA modal vs page
  if (qaPanel?.isOpen()) {
    const rid = qaPanel.reportId() || "overview";
    url.hash = `#/qa/${rid}`;
  } else {
    url.hash = `#/p/${state.page + 1}`;
  }
  if (push) history.pushState({}, "", url);
  else history.replaceState({}, "", url);
  $("#btn-qa")?.classList.toggle("active", Boolean(qaPanel?.isOpen()));
  const bd = $("#qa-backdrop");
  if (bd) bd.setAttribute("aria-hidden", qaPanel?.isOpen() ? "false" : "true");
}

function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  const parts = raw.split("/").filter(Boolean);
  // #/qa | #/qa/labels | #qa/labels | #/p/13 | #p/13
  if (parts[0] === "qa") {
    const report = parts[1] && QA_REPORT_IDS.includes(parts[1]) ? parts[1] : "overview";
    return { kind: "qa", report };
  }
  if (parts[0] === "p" || parts[0] === "page") {
    const n = parseInt(parts[1], 10);
    if (Number.isFinite(n) && n >= 1) return { kind: "page", page1: n };
  }
  return { kind: "none" };
}

let hashApplying = false;
let qaPanel = null;

async function goToPage(page1, { row = null, push = true } = {}) {
  if (!state.pageCount) return;
  state.page = Math.min(Math.max(0, page1 - 1), state.pageCount - 1);
  $("#pageno").value = String(state.page + 1);
  await remountWindow(state.page);
  await renderPdfPage(state.page);
  if (row != null) {
    // Best-effort: scroll HTML row into view after mount
    requestAnimationFrame(() => {
      const sec = document.querySelector(`.page-section[data-page="${state.page}"]`);
      const cell = sec?.querySelector(`td.ln[data-bbox]`);
      // Prefer matching row index text
      const hit = [...(sec?.querySelectorAll("td.ln") || [])].find(
        (el) => el.textContent.trim() === String(row)
      );
      (hit || cell)?.scrollIntoView({ block: "center", behavior: "smooth" });
      if (hit) hit.click();
    });
  }
  syncRoute(push);
}

function applyHashRoute({ push = false } = {}) {
  if (hashApplying) return;
  hashApplying = true;
  try {
    const h = parseHash();
    if (h.kind === "qa") {
      qaPanel?.open(h.report);
      $("#qa-backdrop")?.classList.add("open");
      $("#btn-qa")?.classList.add("active");
    } else {
      qaPanel?.close();
      $("#qa-backdrop")?.classList.remove("open");
      $("#btn-qa")?.classList.remove("active");
      if (h.kind === "page" && state.pageCount) {
        const page0 = Math.min(Math.max(0, h.page1 - 1), state.pageCount - 1);
        if (page0 !== state.page) {
          state.page = page0;
          $("#pageno").value = String(page0 + 1);
          remountWindow(page0).then(() => renderPdfPage(page0));
        }
      }
    }
    // Keep query page in sync without fighting hash
    if (!push) {
      const url = new URL(location.href);
      url.searchParams.set("page", String(state.page + 1));
      history.replaceState({}, "", url);
    }
  } finally {
    hashApplying = false;
  }
}

function openQa(report = "overview") {
  hashApplying = true;
  const url = new URL(location.href);
  url.hash = `#/qa/${report}`;
  history.pushState({}, "", url);
  hashApplying = false;
  applyHashRoute();
}

function closeQa() {
  hashApplying = true;
  const url = new URL(location.href);
  url.hash = `#/p/${state.page + 1}`;
  history.pushState({}, "", url);
  hashApplying = false;
  applyHashRoute();
}

function nearestAvailable(page0, dir) {
  const pdfPages = [...state.byPdf.keys()].sort((a, b) => a - b);
  if (!pdfPages.length) return page0;
  if (dir > 0) {
    const hit = pdfPages.find((p) => p - 1 > page0);
    return hit != null ? hit - 1 : pdfPages[pdfPages.length - 1] - 1;
  }
  if (dir < 0) {
    const hit = [...pdfPages].reverse().find((p) => p - 1 < page0);
    return hit != null ? hit - 1 : pdfPages[0] - 1;
  }
  if (state.byPdf.has(page0 + 1)) return page0;
  const next = pdfPages.find((p) => p - 1 >= page0);
  if (next != null) return next - 1;
  return pdfPages[pdfPages.length - 1] - 1;
}

async function openPdfDocument(bytes) {
  setLoad("Opening PDF…");
  await cancelActiveRender();
  if (state.pdfDoc) {
    try { await state.pdfDoc.destroy(); } catch (_) { /* ignore */ }
    state.pdfDoc = null;
  }
  state.rotateExtra = 0;
  state.pdfViewport = null;
  state.pdfPageSize = null;
  state.pdfView = null;
  state.pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
  state.pageCount = state.pdfDoc.numPages;
  state.pages = new Array(state.pageCount);
}

async function loadPack(name, page0) {
  state.mode = "pack";
  state.packName = name;
  state.run = name;
  state.page = page0;
  state.pages = [];
  state.byPdf = new Map();
  state.inflight.clear();
  state.dataShardCache.clear();
  state.manifest = null;
  state.index = null;
  $("#run").value = name;
  $("#pageno").value = String(page0 + 1);

  setLoad(`Loading pack manifest ${name}…`);
  const manifest = await fetchJsonMaybeGzip(PACK_MANIFEST_URL(name));
  if (!(manifest.data_shards || []).length) {
    throw new Error(
      `Pack ${name} has no data_shards — re-run pack_pdf_ocr_pages.py with --data`
    );
  }
  state.manifest = manifest;
  state.volume = manifest.volume || inferVolume(manifest.index_pdf) || "VOLUME-2B";

  for (let p1 = 1; p1 <= (manifest.page_count || 0); p1++) {
    state.byPdf.set(p1, { page: p1, inferred: true });
  }

  const bytes = await loadPdfBytes(state.volume, manifest.index_pdf, manifest);
  await openPdfDocument(bytes);

  if (manifest.page_count && manifest.page_count !== state.pageCount) {
    console.warn(
      `manifest page_count=${manifest.page_count} vs PDF ${state.pageCount}`
    );
  }

  state.page = Math.min(Math.max(0, page0), state.pageCount - 1);
  $("#pageno").value = String(state.page + 1);

  populateKindFilter();
  await loadQaSuspects(name);
  await remountWindow(state.page);
  await renderPdfPage(state.page);
  syncRoute(true);
  setLoad(null);
  let status =
    `Pack ${name} · ${state.pageCount}p · ${(manifest.data_shards || []).length} data shard(s) · ${state.volume}`;
  if (state.qa.loaded) {
    status += ` · QA unfixed ${state.qa.nUnfixed} (fixed ${state.qa.nFixed})`;
  }
  setStatus(status);
}

async function loadRun(run, page0) {
  state.mode = "live";
  state.packName = null;
  state.manifest = null;
  state.dataShardCache.clear();
  state.run = run;
  state.page = page0;
  state.pages = [];
  state.byPdf = new Map();
  state.inflight.clear();
  $("#run").value = run;
  $("#pageno").value = String(page0 + 1);

  setLoad(`Loading ${run}/index.json…`);
  const indexUrl = `${runDirUrl(run)}/index.json`;
  const res = await fetch(indexUrl);
  if (!res.ok) {
    setLoad(null);
    throw new Error(`Missing ${indexUrl} — run pdf_to_html.py with --out pdf_ocr/output/${run}`);
  }
  const index = await res.json();
  state.index = index;
  state.volume = inferVolume(index.pdf);
  for (const entry of index.pages || []) {
    const p = entry.page;
    if (typeof p === "number") state.byPdf.set(p, entry);
  }

  const bytes = await loadPdfBytes(state.volume, index.pdf, null);
  await openPdfDocument(bytes);

  if (state.byPdf.size > 0 && state.byPdf.size < Math.min(20, state.pageCount * 0.25)) {
    console.warn(
      `index.json only lists ${state.byPdf.size} pages; enabling on-demand fetch for all ${state.pageCount} PDF pages`
    );
    toast(`index.json incomplete (${state.byPdf.size} entries) — fetching page JSON on demand`);
  }
  for (let p1 = 1; p1 <= state.pageCount; p1++) {
    if (!state.byPdf.has(p1)) state.byPdf.set(p1, { page: p1, inferred: true });
  }

  state.page = Math.min(Math.max(0, page0), state.pageCount - 1);
  $("#pageno").value = String(state.page + 1);

  populateKindFilter();
  await loadQaSuspects(run);
  await remountWindow(state.page);
  await renderPdfPage(state.page);
  syncRoute(true);
  setLoad(null);
  const listed = [...state.byPdf.values()].filter((e) => !e.inferred).length;
  let status =
    `Live ${run} · index ${listed}/${state.pageCount} · PDF ${state.pageCount} · ${state.volume}`;
  if (state.qa.loaded) {
    status += ` · QA unfixed ${state.qa.nUnfixed} (fixed ${state.qa.nFixed})`;
  }
  setStatus(status);
}

function loadViewer(name, page0) {
  if (boot.mode === "pack" || SITE.defaultPack) {
    const pack = (boot.mode === "pack" ? name : null) || state.packName || SITE.defaultPack || name;
    return loadPack(pack, page0);
  }
  return loadRun(name || state.run, page0);
}

function applyPdfSplit(pct) {
  const clamped = Math.min(75, Math.max(20, pct));
  state.pdfSplitPct = clamped;
  $("#pdfpane").style.flex = `0 0 ${clamped}%`;
  $("#pdfpane").style.width = `${clamped}%`;
}

$("#reload").onclick = () => {
  const name = $("#run").value.trim() || state.run;
  const page0 = Math.max(0, parseInt($("#pageno").value, 10) - 1 || 0);
  // Reload keeps current mode; typing a name with ?pack= or SITE.defaultPack uses pack
  const loader =
    state.mode === "pack" || SITE.defaultPack
      ? () => loadPack(name, page0)
      : () => loadRun(name, page0);
  loader().catch((e) => { console.error(e); toast(String(e.message || e)); });
};
$("#run").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("#reload").click();
});
$("#kind-filter").onchange = (e) => {
  state.kindFilter = e.target.value || "";
  applyKindFilter(document);
  renderBoxes();
};
$("#go-page").onclick = async () => {
  const p = Math.max(1, parseInt($("#pageno").value, 10) || 1);
  await goToPage(p, { push: true });
};
$("#prev-avail").onclick = async () => {
  await goToPage(nearestAvailable(state.page, -1) + 1, { push: true });
};
$("#next-avail").onclick = async () => {
  await goToPage(nearestAvailable(state.page, 1) + 1, { push: true });
};
$("#auto-pdf-sync").onchange = (e) => {
  state.scroll.autoPdfSync = e.target.checked;
};
$("#show-qa").onchange = async (e) => {
  state.qa.show = e.target.checked;
  document.body.classList.toggle("hide-qa-marks", !state.qa.show);
  await remountWindow(state.page);
};
$("#toggle-calib").onclick = () => {
  const bar = $("#calibbar");
  const open = bar.classList.toggle("open");
  $("#toggle-calib").classList.toggle("active", open);
  $("#toggle-calib").textContent = open ? "Hide offset" : "BBox offset";
};
$("#show-cells").onchange = (e) => {
  state.show.cells = e.target.checked;
  renderBoxes();
};
$("#show-cols").onchange = (e) => {
  state.show.cols = e.target.checked;
  renderBoxes();
};
$("#clear-sel").onclick = () => selectNone();

$("#rd-close").onclick = () => {
  const dlg = $("#row-detail");
  if (!dlg) return;
  if (typeof dlg.close === "function") dlg.close();
  else dlg.removeAttribute("open");
};
$("#rd-copy").onclick = async () => {
  const raw = state._detailJson;
  if (!raw) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(raw, null, 2));
    toast("Row JSON copied");
  } catch (_) {
    toast("Copy failed");
  }
};
$("#row-detail")?.addEventListener("click", (ev) => {
  if (ev.target === $("#row-detail")) {
    if (typeof $("#row-detail").close === "function") $("#row-detail").close();
  }
});

function bindCalibPair(numId, rangeId, onNum) {
  const num = $(numId);
  const range = $(rangeId);
  const sync = (fromRange) => {
    if (fromRange) num.value = range.value;
    else range.value = num.value;
    onNum();
  };
  num.addEventListener("input", () => sync(false));
  range.addEventListener("input", () => sync(true));
}

$("#cal-flip-y").onchange = () => readCalibFromUi();
bindCalibPair("#cal-scale", "#cal-scale-range", readCalibFromUi);
bindCalibPair("#cal-ox", "#cal-ox-range", readCalibFromUi);
bindCalibPair("#cal-oy", "#cal-oy-range", readCalibFromUi);
bindCalibPair("#cal-vx", "#cal-vx-range", readCalibFromUi);
bindCalibPair("#cal-vy", "#cal-vy-range", readCalibFromUi);

document.querySelectorAll("#calibbar [data-nudge]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const [key, delta] = btn.getAttribute("data-nudge").split(",");
    const el = key === "ox" ? $("#cal-ox") : $("#cal-oy");
    el.value = String((parseFloat(el.value) || 0) + parseFloat(delta));
    readCalibFromUi();
  });
});

$("#cal-reset").onclick = () => {
  state.bboxCalib = { flipY: true, scale: 1, ox: 0, oy: 0, vx: 0, vy: 0 };
  try {
    localStorage.removeItem("pdf-ocr-live-bbox-calib");
    localStorage.removeItem("pdf-ocr-live-bbox-calib-v2");
    localStorage.removeItem("pdf-ocr-live-bbox-calib-v3");
    localStorage.removeItem("pdf-ocr-live-bbox-calib-v4");
  } catch (_) { /* ignore */ }
  syncCalibUi();
  renderBoxes();
};

$("#z-fitw").onclick = () => {
  state.zoom.mode = "fitw";
  syncZoomUi();
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};
$("#z-fith").onclick = () => {
  state.zoom.mode = "fith";
  syncZoomUi();
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};
$("#z-in").onclick = () => {
  state.zoom.mode = "custom";
  state.zoom.pct = Math.min(400, state.zoom.pct + 10);
  $("#z-pct").value = String(state.zoom.pct);
  syncZoomUi();
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};
$("#z-out").onclick = () => {
  state.zoom.mode = "custom";
  state.zoom.pct = Math.max(10, state.zoom.pct - 10);
  $("#z-pct").value = String(state.zoom.pct);
  syncZoomUi();
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};
$("#z-pct").onchange = () => {
  state.zoom.mode = "custom";
  state.zoom.pct = Math.min(400, Math.max(10, parseInt($("#z-pct").value, 10) || 100));
  syncZoomUi();
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};
$("#z-rot").onclick = () => {
  state.rotateExtra = (state.rotateExtra + 90) % 360;
  renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
};

(() => {
  const bar = $("#splitbar");
  let dragging = false;
  bar.addEventListener("pointerdown", (e) => {
    dragging = true;
    bar.classList.add("dragging");
    document.body.classList.add("split-dragging");
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const main = $("#main").getBoundingClientRect();
    applyPdfSplit(((e.clientX - main.left) / main.width) * 100);
    renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
  });
  bar.addEventListener("pointerup", () => {
    dragging = false;
    bar.classList.remove("dragging");
    document.body.classList.remove("split-dragging");
  });
})();

window.addEventListener("resize", () => {
  if (state.pdfDoc) renderPdfPage(state.scroll.pdfFocusPage ?? state.page);
});

applyPdfSplit(state.pdfSplitPct);
$("#run").value = state.run;
loadCalib();

qaPanel = createQaPanel({
  root: $("#qa-panel"),
  getRun: () => state.run,
  getQaBases: () => {
    const name = state.packName || state.run;
    const bases = [];
    if (OUTPUT_BASE) bases.push(`${OUTPUT_BASE}/${encodeURIComponent(name)}/qa`);
    if (PACK_BASE) bases.push(`${PACK_BASE}/${encodeURIComponent(name)}/qa`);
    return bases;
  },
  onGoPage: async (page1, { row } = {}) => {
    closeQa();
    await goToPage(page1, { row, push: true });
  },
  onReportChange: (reportId) => {
    if (hashApplying) return;
    if (reportId == null) {
      // Closed via panel ✕
      hashApplying = true;
      $("#qa-backdrop")?.classList.remove("open");
      $("#btn-qa")?.classList.remove("active");
      const url = new URL(location.href);
      url.hash = `#/p/${state.page + 1}`;
      history.pushState({}, "", url);
      hashApplying = false;
      return;
    }
    hashApplying = true;
    const url = new URL(location.href);
    url.hash = `#/qa/${reportId}`;
    history.replaceState({}, "", url);
    hashApplying = false;
    $("#btn-qa")?.classList.add("active");
  },
});

$("#btn-qa").onclick = () => {
  if (qaPanel.isOpen()) closeQa();
  else openQa(qaPanel.reportId() || "overview");
};
$("#qa-backdrop").addEventListener("click", (ev) => {
  if (ev.target === $("#qa-backdrop")) closeQa();
});
window.addEventListener("hashchange", () => applyHashRoute());
window.addEventListener("popstate", () => applyHashRoute());
window.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && qaPanel?.isOpen()) {
    ev.preventDefault();
    closeQa();
  }
});

const bootLoader =
  boot.mode === "pack" || SITE.defaultPack
    ? () => loadPack(boot.pack || SITE.defaultPack || state.run, state.page)
    : () => loadRun(state.run, state.page);
bootLoader()
  .then(() => {
    // Honor hash after data load (#/qa/… or #/p/N)
    if ((location.hash || "").includes("qa")) applyHashRoute();
    else if (!(location.hash || "").match(/#\/?p\//)) {
      // Normalize empty hash → #/p/N
      hashApplying = true;
      const url = new URL(location.href);
      url.hash = `#/p/${state.page + 1}`;
      history.replaceState({}, "", url);
      hashApplying = false;
    } else {
      applyHashRoute();
    }
  })
  .catch((err) => {
    console.error(err);
    setLoad(null);
    setStatus("Load failed");
    toast(String(err.message || err));
  });
</script>
</body>
</html>
